spring.application.name=kriba
server.port=8080
app.base-url=https://monument-eastcoast-banner.ngrok-free.dev
server.address=0.0.0.0

spring.datasource.url=jdbc:mysql://${DB_HOST:193.70.44.51}:3306/Kriba
spring.datasource.username=${DB_USERNAME:Kriba}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:193.70.44.51}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

apiKey=${GNEWS_API_KEY}
apiKeySummarize=${GEMINI_API_KEY}
geminiModel=gemini-3.1-flash-lite

resilience4j.circuitbreaker.instances.gnewsApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.gnewsApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.gnewsApi.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.gnewsApi.permitted-number-of-calls-in-half-open-state=3


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
